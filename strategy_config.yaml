active_combo: none
symbol: VN30F1M
market_open: 09:00
market_close: '14:30'
scan_interval: 10

# CB: Compression Breakout (3-bar squeeze < 0.7xATR)
# Validated: 130d, WR 74.7%, PF 5.13, +6.69 pts/day (optimized exit 2026-06-06)
# Hyperopt (26d, 2880 combos):
#   Best: comp=0.9, ATR 2.5-4.0, RSI<65, hold=6 → WR 56%, Net +3.40, PF 5.96
#   Alt:  comp=0.7, ATR 2.0-4.0, hold=8 → WR 73%, Net +3.09, PF 4.54
#   Current live: comp=0.7, ATR 2.5-4.5, RSI<70 → Net +1.37 (baseline)
# Cost: 0.96 pts/trade (slippage 0.5 + commission 0.46)

# ── Per-combo detection params (single source of truth) ───────────────────────
combos:
  CB:
    timeframe: 5m
    compression:
      n_bars: 3
      threshold: 0.7
    entry_filter:
      atr_min: 2.5
      atr_max: 4.5
      atr_min_pm: 2.0
      atr_max_pm: 5.0
      rsi_period: 14
      rsi_max: 70
    time_windows:
      am_start: '09:15'
      am_end: '10:45'
      pm_start: '13:15'
      pm_end: '14:15'
    dead_zones:
      - '09:45-10:00'
      - '10:15-10:30'
    dedup_bars: 5
    tp_atr_mult: 4.0

  NR4:
    timeframe: 5m
    direction: SHORT
    nr4_lookback: 4
    compression_threshold: 0.7
    entry_filter:
      atr_min: 2.5
      atr_max: 4.5
    time_windows:
      am_start: '09:15'
      am_end: '10:45'
      pm_start: '13:15'
      pm_end: '14:15'
    dedup_bars: 5
    tp_atr_mult: 4.0

# ── Shared exit params (all combos use same session-aware exit) ────────────────
session_params:
  AM:
    sl_atr_mult: 1.5
    trail_activate_pts: 7.0
    trail_atr_mult: 2.5
    max_hold_bars: 30
    be_trigger_pts: 3.0
    be_atr_min: 3.5
    be_partial_pts: 1.0
  PM:
    sl_atr_mult: 1.2
    trail_activate_pts: 6.0
    trail_atr_mult: 1.0
    max_hold_bars: 8
    be_trigger_pts: 3.0
    be_atr_min: 3.5
    be_partial_pts: 1.0

adaptive_exit:
  enabled: true
  session: AM
  pre_move_ratio_threshold: 0.8
  mfe_trigger_pts: 2.0
  exit_target_pts: 3.2

# ── ML Filter (meta-labeling) ─────────────────────────────────────────────────
ml_filter:
  enabled: false
  shadow_mode: true
  threshold: 0.45
  model_path: ml/models/meta_label_latest.pkl
  retrain_days: 30
  kill_switch_days: 10

# Standalone ML signals (independent of CB)
# Best config: H=6, thr=0.55, AM+SELL, 50 features
# OOS: WR 59.7%, PF 1.57, +1.41 pts/day (60d walk-forward)
# Post-ML filter: ema_align <= 0 → WR 68.4%, PF 1.71
ml_standalone:
  enabled: false
  shadow_mode: true
  threshold: 0.55
  horizon: 6
  session_filter: [AM]
  direction_filter: [SELL]
  max_trades_per_session: 2
  model_path: ml/models/standalone_ml_latest.pkl
  post_ml_filters:
    SELL:
      ema_align_max: 0
    BUY: null

# ── Scanner-level params ──────────────────────────────────────────────────────
combo_tf_map:
  CB:
  - 5m
  NR4:
  - 5m
  - 3m

