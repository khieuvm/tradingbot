active_combo: CB
symbol: VN30F1M
market_open: 09:00
market_close: '14:30'
scan_interval: 10

# CB: Compression Breakout (3-bar squeeze < 0.7xATR)
# Validated: 130d, WR 74.7%, PF 5.13, +6.69 pts/day (optimized exit 2026-06-06)
# Improvements: excl weak AM slots, PM ATR 2.0-5.0, optimized trail/SL/BE
# Cost: 0.96 pts/trade (slippage 0.5 + commission 0.46)

# ── Per-combo detection params (single source of truth) ───────────────────────
combos:
  CB:
    timeframe: 5m
    compression:
      n_bars: 3
      threshold: 0.7
    entry_filter:
      atr_min: 2.5
      atr_max: 4.5
      atr_min_pm: 2.0
      atr_max_pm: 5.0
      rsi_period: 14
      rsi_max: 70
    time_windows:
      am_start: '09:15'
      am_end: '10:45'
      pm_start: '13:15'
      pm_end: '14:15'
    dead_zones:
      - '09:45-10:00'
      - '10:15-10:30'
    dedup_bars: 5
    tp_atr_mult: 4.0

  NR4:
    timeframe: 5m
    direction: SHORT
    nr4_lookback: 4
    compression_threshold: 0.7
    entry_filter:
      atr_min: 2.5
      atr_max: 4.5
    time_windows:
      am_start: '09:15'
      am_end: '10:45'
      pm_start: '13:15'
      pm_end: '14:15'
    dedup_bars: 5
    tp_atr_mult: 4.0

# ── Shared exit params (all combos use same session-aware exit) ────────────────
session_params:
  AM:
    sl_atr_mult: 1.5
    trail_activate_pts: 7.0
    trail_atr_mult: 2.5
    max_hold_bars: 30
    be_trigger_pts: 3.0
    be_atr_min: 3.5
    be_partial_pts: 1.0
  PM:
    sl_atr_mult: 1.2
    trail_activate_pts: 6.0
    trail_atr_mult: 1.0
    max_hold_bars: 8
    be_trigger_pts: 3.0
    be_atr_min: 3.5
    be_partial_pts: 1.0

adaptive_exit:
  enabled: true
  session: AM
  pre_move_ratio_threshold: 0.8
  mfe_trigger_pts: 2.0
  exit_target_pts: 3.2

# ── ML Filter (meta-labeling) ─────────────────────────────────────────────────
ml_filter:
  enabled: false
  shadow_mode: true
  threshold: 0.45
  model_path: ml/models/meta_label_latest.pkl
  retrain_days: 30
  kill_switch_days: 10

# Standalone ML signals (independent of CB)
# Best config: H=6, thr=0.55, AM+SELL, 50 features
# OOS: WR 59.7%, PF 1.57, +1.41 pts/day (60d walk-forward)
# Post-ML filter: ema_align <= 0 → WR 68.4%, PF 1.71
ml_standalone:
  enabled: false
  shadow_mode: true
  threshold: 0.55
  horizon: 6
  session_filter: [AM]
  direction_filter: [SELL]
  max_trades_per_session: 2
  model_path: ml/models/standalone_ml_latest.pkl
  post_ml_filters:
    SELL:
      ema_align_max: 0
    BUY: null

# ── Scanner-level params ──────────────────────────────────────────────────────
combo_tf_map:
  CB:
  - 5m
  NR4:
  - 5m
  - 3m

# ── Shadow Strategies (signal-only, no trade) ────────────────────────────────
# Profitable strategies discovered in June 2026 regime (SELL-dominant, low-vol)
# All run in shadow mode: Telegram alerts only, no order placement
shadow_strategies:
  enabled: true
  strategies:
    choch_1m:
      tf: 1m
      sessions: [AM, PM]
      directions: [SELL, BUY]
      filter: ADX > 15
      edge: "WR 100%, PF inf, +2.66/d (n=8, 22d)"
    momentum_1m_pm_sell:
      tf: 1m
      sessions: [PM]
      directions: [SELL]
      filter: "ADX>25, EMA8<EMA21, DI->DI+, mins>=825"
      edge: "WR 90.9%, PF 10.84, +8.02/d (n=11, 22d)"
    momentum_3m_am_sell:
      tf: 3m
      sessions: [AM]
      directions: [SELL]
      filter: "ADX>25, EMA8<EMA21, DI->DI+"
      edge: "WR 73.3%, PF 2.77, +3.60/d (n=15, 22d)"
    heikin_ashi_3m_pm_sell:
      tf: 3m
      sessions: [PM]
      directions: [SELL]
      filter: "mins>=825, 3+ green->red HA reversal"
      edge: "WR 75%, PF 16.32, +4.06/d (n=4, MONITOR)"
    volume_5m_pm_sell:
      tf: 5m
      sessions: [PM]
      directions: [SELL]
      filter: "vol>2xSMA20, bearish bar, range>0.5*ATR, ADX>=25"
      edge: "WR 75%, PF 4.39, +7.67/d (n=12, 22d)"
    confluence_5m_sell:
      tf: 5m
      sessions: [AM, PM]
      directions: [SELL]
      filter: "3+ of 22 strategies fire SELL + ADX>=20"
      edge: "WR 72.7%, PF 3.10, +4.45/d (n=11, 22d)"

# ── RAW Exit Strategies (validated on full 682d data) ────────────────────────
# Logic: wide SL (3.0xATR), no trail, no TP, hold to session end
# These WORK on full data because winners run to session end (avg +7-8pts)
# while losers are capped by wide SL (avg -4pts). Win/Loss ~2.0x.
# Currently in SHADOW mode — monitor for 2-3 weeks before live trading.
raw_exit_strategies:
  enabled: true
  shadow_mode: true
  sl_atr_mult: 3.0
  exit: session_end
  strategies:
    raw_momentum_1m_pm_buy:
      tf: 1m
      sessions: [PM]
      directions: [BUY]
      regime_filter: "price > EMA50 + 0.5*ATR"
      edge: "N=1074, WR 40.7%, PF 1.39, +1.55/d (682d)"
    raw_momentum_1m_pm_sell:
      tf: 1m
      sessions: [PM]
      directions: [SELL]
      regime_filter: "price < EMA50 - 0.5*ATR"
      edge: "N=489, WR 42.9%, PF 1.44, +0.76/d (682d)"
    raw_macd_1m_pm_buy:
      tf: 1m
      sessions: [PM]
      directions: [BUY]
      regime_filter: "price > EMA50 + 0.5*ATR"
      edge: "N=424, WR 40.6%, PF 1.30, +0.44/d (682d)"
    raw_divergence_1m_am_sell:
      tf: 1m
      sessions: [AM]
      directions: [SELL]
      regime_filter: "price < EMA50 - 0.5*ATR"
      edge: "N=52, WR 44.2%, PF 1.51, +0.06/d (682d)"

# ── Opening Strategies (AM + PM session) ───────────────────────────────────────
