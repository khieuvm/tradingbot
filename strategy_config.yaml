combos:
  A_Trend_Pullback:
    confirm:
    - adx_di
    - macd_cross
    - macd_hist_rev
    - obv_confirm
    desc: 'Pullback trong trend: EMA Ribbon xếp hàng + giá hồi về EMA21. Gate bởi
      MACD momentum + OBV xác nhận + TEMA.'
    gate:
    - macd_filter
    - tema_guard
    - volume_ratio_gate
    name: 'A: Trend Pullback (~65% WR)'
    primary:
    - ema_ribbon
    - ema_pullback
  G_MeanReversion_Crypto:
    confirm:
    - stoch_cross
    - bb_bounce
    - rsi_div
    - obv_confirm
    desc: 'Đảo chiều mean-reversion: CCI+Williams%R+MFI cùng ở vùng cực. Xác nhận
      bởi Stochastic cross + BB bounce + RSI phân kỳ.'
    gate:
    - volume_ratio_gate
    name: 'G: Multi-Oscillator Reversal'
    primary:
    - cci_extreme
    - williams_extreme
    - mfi_confirm
  M_TrendBreakout_Crypto:
    confirm:
    - adx_di
    - ema_ribbon
    - macd_cross
    - obv_confirm
    desc: 'Breakout xu hướng: Trend Composite + Supertrend + phá vỡ hỗ trợ/kháng cự.
      KB squeeze đảm bảo trend đủ mạnh.'
    gate:
    - trend_strength_gate
    - kb_squeeze
    - volume_ratio_gate
    name: 'M: Trend Breakout'
    primary:
    - trend_composite
    - supertrend_flip
    - sr_breakout
  N_RegimeAdaptive_Crypto:
    confirm:
    - supertrend_flip
    - obv_confirm
    - macd_hist_rev
    - adx_di
    desc: 'Tự thích ứng xu hướng: ADX phân biệt trend/sideway. Trend→EMA cắt lên/xuống.
      Sideway→RSI quá mua/bán + BB bounce. Xác nhận bởi Supertrend + OBV.'
    gate:
    - ema200_bias
    name: 'N: Regime Adaptive'
    primary:
    - regime_ema_cross
    - regime_range_bounce
  Gplus_Enhanced:
    confirm:
    - stoch_cross
    - bb_bounce
    - rsi_div
    - obv_confirm
    - vol_price_divergence
    desc: 'Bắt đảo chiều từ vùng cực: CCI+Williams%R+MFI đồng loạt báo quá bán/quá
      mua. Lọc chất lượng bằng momentum ratio + tương quan volume-giá. SL nhỏ, TP
      lớn (R:R 1:7.5).'
    gate:
    - volume_ratio_gate
    - momentum_ratio_gate
    - g_regime_gate
    name: 'G+: Enhanced Multi-Oscillator'
    primary:
    - cci_extreme
    - williams_extreme
    - mfi_confirm
  F_Supertrend:
    confirm:
    - adx_di
    - ema_ribbon
    - macd_cross
    - obv_confirm
    desc: 'Supertrend đổi hướng + ADX xác nhận trend mạnh + MACD momentum + volume
      trên trung bình. Scalp ngắn: SL/TP nhỏ, hold tối đa 30 phút.'
    gate:
    - macd_filter
    - volume_ratio_gate
    - tema_guard
    name: 'F: Supertrend Momentum'
    primary:
    - supertrend_flip
  V_VWAP_Dip_Bounce:
    confirm:
    - cci_extreme
    - williams_extreme
    - bb_bounce
    - adx_di
    - obv_confirm
    - mfi_confirm
    - adx_trend_filter
    desc: 'Bắt move lớn 5+pts: giá dưới/trên VWAP + kéo 3 nến + osc extreme. Session
      gate tránh opening noise. TP=3.5xATR.'
    gate:
    - session_open_filter
    name: 'V: VWAP Dip Bounce'
    primary:
    - vwap_side_bounce
  V2_Bounce_Confirm:
    confirm:
    - adx_di
    - obv_confirm
    - adx_trend_filter
    desc: 'V2: Chờ nến đảo chiều đầu tiên sau khi oscillator extreme + pullback. Fix
      falling-knife của V. Entry trễ 1-2 nến nhưng WR cao hơn. TP=3.5xATR.'
    gate:
    - session_open_filter
    name: 'V2: Bounce Confirm'
    primary:
    - bounce_confirm
  X_Big_Move_Catcher:
    confirm:
    - supertrend_flip
    - adx_di
    - obv_confirm
    - macd_hist_rev
    - cci_extreme
    - williams_extreme
    desc: 'Data-driven (153 moves >=7pts, 120d): 59% preceded by STOP HUNT. Entry after
      liquidity sweep (price breaks recent H/L then reverses) + pullback reversal.
      88% have traps. Trap confirm gate ensures sweep + volume. SL tight, TP wide (R:R 3-4:1).'
    gate:
    - volume_ratio_gate
    - trap_confirmation_gate
    name: 'X: Big Move Catcher'
    primary:
    - liquidity_sweep
    - pullback_reversal
