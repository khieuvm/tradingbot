# ── Day Trend Predictor (Opening Pulse 9:00-9:30 + Retracement 9:45) ─────────
# Research: 680 sessions, |pulse|>3.5 → HR 79.6% day direction
# 9:45 retrace <30% → 100% continuation; <50% → 59% continuation
# DOW: Wed UP strongest (73.1%), Mon DOWN strongest (70.3%), Fri weakest (61.2%)
day_trend:
  enabled: true
  shadow_mode: true            # log + telegram only, no real trades
  enable_bias_filter: true     # filter CB/NR4 signals against prediction
  enable_signal: true          # generate independent DayTrend entry signal

  pulse:
    min_pts: 3.5               # minimum |pulse| for HIGH edge (79.6% HR)
    compute_bar_hhmm: 565      # 9:25 bar close = pulse endpoint

  retracement:
    check_at_hhmm: 585         # 9:45 = retracement check time
    threshold_high_pct: 30     # retrace < 30% → HIGH confidence (100% cont)
    threshold_medium_pct: 50   # retrace < 50% → MEDIUM confidence (59% cont)

  # DOW tier adjustments: +1 = boost confidence, -1 = penalize
  # 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri
  dow_adjustments:
    0: {DOWN: 1}               # Mon DOWN strongest (70.3%)
    2: {UP: 1}                 # Wed UP strongest (73.1%)
    4: {UP: -1, DOWN: -1}      # Fri weakest overall (61.2%)

  signal:
    tp_mult: 2.0               # TP = 2× pulse magnitude
    sl_mode: day_open           # SL at day open (100% retrace = 36% cont)

  pm_reversal:
    enabled: true              # monitor PM for reversal against pulse
    alert_only: true           # only alert, don't auto-flip
